<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4ac0d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)"/>
  <!-- Hotel building icon -->
  <rect x="136" y="160" width="240" height="240" rx="12" fill="#ffffff" opacity="0.95"/>
  <rect x="160" y="184" width="44" height="44" rx="6" fill="url(#bgGrad)" opacity="0.7"/>
  <rect x="234" y="184" width="44" height="44" rx="6" fill="url(#bgGrad)" opacity="0.7"/>
  <rect x="308" y="184" width="44" height="44" rx="6" fill="url(#bgGrad)" opacity="0.7"/>
  <rect x="160" y="248" width="44" height="44" rx="6" fill="url(#bgGrad)" opacity="0.7"/>
  <rect x="234" y="248" width="44" height="44" rx="6" fill="url(#bgGrad)" opacity="0.7"/>
  <rect x="308" y="248" width="44" height="44" rx="6" fill="url(#bgGrad)" opacity="0.7"/>
  <!-- Door -->
  <rect x="228" y="340" width="56" height="60" rx="8" fill="url(#goldGrad)"/>
  <circle cx="274" cy="372" r="4" fill="#1e3a5f"/>
  <!-- Star on top -->
  <polygon points="256,100 268,138 308,138 276,160 288,198 256,176 224,198 236,160 204,138 244,138" fill="url(#goldGrad)"/>
  <!-- Magnifying glass overlay -->
  <circle cx="370" cy="130" r="50" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.9"/>
  <line x1="406" y1="166" x2="440" y2="200" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
</svg>
