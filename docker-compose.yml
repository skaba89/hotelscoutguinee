# ============================================================
# HotelScout Guinea — Docker Compose
# Production-ready stack: App + Caddy reverse proxy
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelscout-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/hotelscout.db
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent SQLite database — survives container rebuilds
      - hotelscout-data:/app/data
    networks:
      - hotelscout-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: hotelscout-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - hotelscout-caddy-data:/data
      - hotelscout-caddy-config:/config
    networks:
      - hotelscout-net
    depends_on:
      app:
        condition: service_healthy

volumes:
  hotelscout-data:
    driver: local
  hotelscout-caddy-data:
    driver: local
  hotelscout-caddy-config:
    driver: local

networks:
  hotelscout-net:
    driver: bridge
